<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
  :root{
    --bg:#FAF8EF;
    --board:#BBADA0;
    --cell:rgba(238,228,218,0.35);
    --text-dark:#776E65;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  #app{ width:100%; max-width:420px; padding:20px; }
  header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
  h1{ margin:0; font-size:42px; font-weight:800; color:var(--text-dark); letter-spacing:-0.02em; }
  .sub{ font-size:13px; color:#9B9088; margin-top:2px; }
  .scores{ display:flex; gap:8px; }
  .score-box{ position:relative; background:var(--board); border-radius:7px; padding:8px 16px; text-align:center; min-width:64px; }
  .score-box .l{ font-size:10px; color:#EEE4DA; font-weight:700; letter-spacing:.04em; }
  .score-box .n{ font-size:20px; color:#fff; font-weight:800; font-variant-numeric:tabular-nums; }
  .float-gain{
    position:absolute; top:-4px; left:50%;
    transform:translateX(-50%);
    color:#776E65; font-weight:800; font-size:15px;
    pointer-events:none;
    animation:floatUp .7s ease-out forwards;
  }
  @keyframes floatUp{
    0%{ opacity:0; transform:translate(-50%,4px); }
    25%{ opacity:1; }
    100%{ opacity:0; transform:translate(-50%,-28px); }
  }
  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .hint{ font-size:13px; color:#9B9088; }
  button{ font-family:inherit; border:none; cursor:pointer; }
  #newGame{ background:#8F7A66; color:#fff; font-size:14px; font-weight:700; padding:9px 16px; border-radius:7px; transition:transform .08s; }
  #newGame:active{ transform:translateY(1px) scale(.97); }
  #board-wrap{ position:relative; background:var(--board); border-radius:10px; padding:10px; box-shadow:0 14px 34px rgba(119,110,101,0.25); }
  #board{ position:relative; display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr); gap:10px; width:100%; aspect-ratio:1/1; }
  .bg-cell{ background:var(--cell); border-radius:6px; }
  #tiles{ position:absolute; inset:10px; }
  .tile-pos{
    position:absolute; top:0; left:0;
    will-change:transform;
  }
  .tile-inner{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    border-radius:6px;
    font-weight:800;
    box-shadow:0 1px 0 rgba(255,255,255,0.25) inset, 0 2px 4px rgba(0,0,0,0.08);
  }
  .pop-new .tile-inner{ animation:tileNew .18s ease-out; }
  .pop-merge .tile-inner{ animation:tileMerge .16s ease-in-out; }
  @keyframes tileNew{
    0%{ transform:scale(0); }
    70%{ transform:scale(1.08); }
    100%{ transform:scale(1); }
  }
  @keyframes tileMerge{
    0%{ transform:scale(1); }
    45%{ transform:scale(1.18); }
    100%{ transform:scale(1); }
  }
  .panel{
    position:absolute; inset:10px; background:rgba(250,248,239,0.85);
    border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:10; opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .panel.show{ opacity:1; pointer-events:auto; }
  .panel h2{ margin:0 0 14px; font-size:28px; color:var(--text-dark); }
  .panel .row{ display:flex; gap:10px; }
  .panel button{ background:#8F7A66; color:#fff; font-size:14px; font-weight:700; padding:10px 20px; border-radius:7px; }
  .panel button.secondary{ background:#BBADA0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>2048</h1>
      <div class="sub">타일을 합쳐서 2048을 만드세요</div>
    </div>
    <div class="scores">
      <div class="score-box">
        <div class="l">SCORE</div>
        <div class="n" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="l">BEST</div>
        <div class="n" id="best">0</div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="hint">방향키 또는 스와이프로 이동</div>
    <button id="newGame">새 게임</button>
  </div>

  <div id="board-wrap">
    <div id="board">
      <div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div>
      <div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div>
      <div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div>
      <div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div>
      <div id="tiles"></div>
      <div class="panel" id="winPanel">
        <h2>2048 달성! 🎉</h2>
        <div class="row">
          <button id="continueBtn">계속하기</button>
          <button class="secondary" id="restartFromWin">다시 하기</button>
        </div>
      </div>
      <div class="panel" id="overPanel">
        <h2>게임 오버</h2>
        <button id="retryBtn">다시 하기</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const SIZE = 4;
  const GAP = 10;
  const tilesEl = document.getElementById('tiles');
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const winPanel = document.getElementById('winPanel');
  const overPanel = document.getElementById('overPanel');
  const scoreBox = document.querySelector('.score-box');

  const COLORS = {
    2:['#EEE4DA','#776E65'], 4:['#EDE0C8','#776E65'],
    8:['#F2B179','#F9F6F2'], 16:['#F59563','#F9F6F2'],
    32:['#F67C5F','#F9F6F2'], 64:['#F65E3B','#F9F6F2'],
    128:['#EDCF72','#F9F6F2'], 256:['#EDCC61','#F9F6F2'],
    512:['#EDC850','#F9F6F2'], 1024:['#EDC53F','#F9F6F2'],
    2048:['#EDC22E','#F9F6F2']
  };

  let idSeq = 1;
  function Tile(pos, value){
    this.id = idSeq++;
    this.r = pos.r; this.c = pos.c;
    this.value = value || 2;
    this.previousPosition = null;
    this.mergedFrom = null;
  }
  Tile.prototype.savePosition = function(){ this.previousPosition = { r:this.r, c:this.c }; };
  Tile.prototype.updatePosition = function(pos){ this.r = pos.r; this.c = pos.c; };

  function Grid(){ this.cells = this.empty(); }
  Grid.prototype.empty = function(){
    const cells = [];
    for(let r=0;r<SIZE;r++){ cells[r]=[]; for(let c=0;c<SIZE;c++) cells[r][c]=null; }
    return cells;
  };
  Grid.prototype.eachCell = function(cb){
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) cb(r,c,this.cells[r][c]);
  };
  Grid.prototype.availableCells = function(){
    const list = [];
    this.eachCell((r,c,t)=>{ if(!t) list.push({r,c}); });
    return list;
  };
  Grid.prototype.cellsAvailable = function(){ return this.availableCells().length > 0; };
  Grid.prototype.randomAvailableCell = function(){
    const cells = this.availableCells();
    return cells[Math.floor(Math.random()*cells.length)];
  };
  Grid.prototype.withinBounds = function(pos){ return pos.r>=0 && pos.r<SIZE && pos.c>=0 && pos.c<SIZE; };
  Grid.prototype.cellContent = function(pos){ return this.withinBounds(pos) ? this.cells[pos.r][pos.c] : null; };
  Grid.prototype.insertTile = function(tile){ this.cells[tile.r][tile.c] = tile; };
  Grid.prototype.removeTile = function(tile){ this.cells[tile.r][tile.c] = null; };

  let grid, score, best, over, won, keepPlaying;

  function loadBest(){ try{ return parseInt(localStorage.getItem('g2048_best')||'0',10)||0; }catch(e){ return 0; } }
  function saveBest(v){ try{ localStorage.setItem('g2048_best', String(v)); }catch(e){} }

  function setup(){
    grid = new Grid();
    score = 0; over = false; won = false; keepPlaying = false;
    best = loadBest();
    winPanel.classList.remove('show');
    overPanel.classList.remove('show');
    addRandomTile(); addRandomTile();
    actuate(0);
  }

  function addRandomTile(){
    if(!grid.cellsAvailable()) return;
    const value = Math.random() < 0.9 ? 2 : 4;
    const cell = grid.randomAvailableCell();
    grid.insertTile(new Tile(cell, value));
  }

  function prepareTiles(){
    grid.eachCell((r,c,tile)=>{ if(tile){ tile.mergedFrom = null; tile.savePosition(); } });
  }

  function moveTile(tile, cell){
    grid.cells[tile.r][tile.c] = null;
    grid.cells[cell.r][cell.c] = tile;
    tile.updatePosition(cell);
  }

  function getVector(dir){
    return { up:{r:-1,c:0}, down:{r:1,c:0}, left:{r:0,c:-1}, right:{r:0,c:1} }[dir];
  }
  function buildTraversals(vector){
    const r=[0,1,2,3], c=[0,1,2,3];
    if(vector.r===1) r.reverse();
    if(vector.c===1) c.reverse();
    return {r,c};
  }
  function findFarthestPosition(cell, vector){
    let previous;
    do{
      previous = cell;
      cell = { r: previous.r+vector.r, c: previous.c+vector.c };
    } while(grid.withinBounds(cell) && !grid.cellContent(cell));
    return { farthest: previous, next: cell };
  }
  function positionsEqual(a,b){ return a.r===b.r && a.c===b.c; }

  function tileMatchesAvailable(){
    let found = false;
    grid.eachCell((r,c,tile)=>{
      if(found || !tile) return;
      [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dr,dc])=>{
        const other = grid.cellContent({r:r+dr,c:c+dc});
        if(other && other.value === tile.value) found = true;
      });
    });
    return found;
  }
  function movesAvailable(){ return grid.cellsAvailable() || tileMatchesAvailable(); }

  function move(dir){
    if(over || (won && !keepPlaying)) return;
    const vector = getVector(dir);
    const traversals = buildTraversals(vector);
    let moved = false;
    let gained = 0;

    prepareTiles();

    traversals.r.forEach(r=>{
      traversals.c.forEach(c=>{
        const cell = {r,c};
        const tile = grid.cellContent(cell);
        if(!tile) return;
        const positions = findFarthestPosition(cell, vector);
        const next = grid.cellContent(positions.next);

        if(next && next.value === tile.value && !next.mergedFrom){
          const merged = new Tile(positions.next, tile.value*2);
          merged.mergedFrom = [tile, next];
          grid.insertTile(merged);
          grid.removeTile(tile);
          tile.updatePosition(positions.next);
          gained += merged.value;
          if(merged.value === 2048 && !won) won = true;
          moved = true;
        } else {
          moveTile(tile, positions.farthest);
          if(!positionsEqual(cell, positions.farthest)) moved = true;
        }
      });
    });

    if(moved){
      score += gained;
      addRandomTile();
      if(!movesAvailable()) over = true;
      actuate(gained);
    }
  }

  function cellSize(){
    const rect = boardEl.getBoundingClientRect();
    const inner = rect.width - GAP*2;
    return (inner - GAP*3) / 4;
  }
  function px(pos, s){ return { x: pos.c*(s+GAP), y: pos.r*(s+GAP) }; }

  function buildTileEl(tile, s){
    const wrapper = document.createElement('div');
    wrapper.className = 'tile-pos';
    wrapper.style.width = s+'px';
    wrapper.style.height = s+'px';

    const inner = document.createElement('div');
    inner.className = 'tile-inner';
    const [bg, fg] = COLORS[tile.value] || ['#3C3A32','#F9F6F2'];
    inner.style.background = bg;
    inner.style.color = fg;
    inner.style.fontSize = (tile.value>512 ? s*0.32 : tile.value>64 ? s*0.36 : s*0.42)+'px';
    inner.textContent = tile.value;

    const startPos = tile.previousPosition || {r:tile.r, c:tile.c};
    const startXY = px(startPos, s);
    wrapper.style.transform = `translate(${startXY.x}px, ${startXY.y}px)`;

    if(tile.previousPosition){
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          const endXY = px({r:tile.r,c:tile.c}, s);
          wrapper.style.transition = 'transform 120ms cubic-bezier(0.22,1,0.36,1)';
          wrapper.style.transform = `translate(${endXY.x}px, ${endXY.y}px)`;
        });
      });
    } else if(tile.mergedFrom){
      wrapper.classList.add('pop-merge');
    } else {
      wrapper.classList.add('pop-new');
    }

    wrapper.appendChild(inner);
    return wrapper;
  }

  function actuate(gained){
    const s = cellSize();
    requestAnimationFrame(()=>{
      tilesEl.innerHTML = '';
      // render merge "ghost" source tiles first so they sit beneath the merged tile visually
      grid.eachCell((r,c,tile)=>{
        if(tile && tile.mergedFrom){
          tile.mergedFrom.forEach(src => tilesEl.appendChild(buildTileEl(src, s)));
        }
      });
      grid.eachCell((r,c,tile)=>{
        if(tile) tilesEl.appendChild(buildTileEl(tile, s));
      });

      scoreEl.textContent = score;
      if(score > best){ best = score; saveBest(best); }
      bestEl.textContent = best;

      if(gained > 0){
        const g = document.createElement('div');
        g.className = 'float-gain';
        g.textContent = '+' + gained;
        scoreBox.appendChild(g);
        setTimeout(()=> g.remove(), 700);
      }

      if(won && !keepPlaying){
        winPanel.classList.add('show');
      } else if(over){
        overPanel.classList.add('show');
      }
    });
  }

  window.addEventListener('keydown', (e)=>{
    const map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' };
    if(map[e.key]){ e.preventDefault(); move(map[e.key]); }
  });

  let touchStartX=0, touchStartY=0;
  boardEl.addEventListener('touchstart', (e)=>{
    const t = e.changedTouches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
  }, {passive:true});
  boardEl.addEventListener('touchend', (e)=>{
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
    if(Math.max(Math.abs(dx),Math.abs(dy)) < 24) return;
    if(Math.abs(dx) > Math.abs(dy)) move(dx>0 ? 'right' : 'left');
    else move(dy>0 ? 'down' : 'up');
  }, {passive:true});

  document.getElementById('newGame').addEventListener('click', setup);
  document.getElementById('retryBtn').addEventListener('click', setup);
  document.getElementById('restartFromWin').addEventListener('click', setup);
  document.getElementById('continueBtn').addEventListener('click', ()=>{
    keepPlaying = true;
    winPanel.classList.remove('show');
  });
  window.addEventListener('resize', ()=> actuate(0));

  setup();
})();
</script>
</body>
</html>
