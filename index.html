<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
  :root{
    --bg:#FAF8EF;
    --board:#BBADA0;
    --cell:#CDC1B4;
    --text-dark:#776E65;
    --text-light:#F9F6F2;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  #app{
    width:100%;
    max-width:420px;
    padding:20px;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:16px;
  }
  h1{
    margin:0;
    font-size:42px;
    font-weight:700;
    color:var(--text-dark);
    letter-spacing:-0.01em;
  }
  .sub{
    font-size:13px;
    color:#9B9088;
    margin-top:2px;
  }
  .scores{
    display:flex;
    gap:8px;
  }
  .score-box{
    background:var(--board);
    border-radius:6px;
    padding:8px 16px;
    text-align:center;
    min-width:64px;
  }
  .score-box .l{
    font-size:10px;
    color:#EEE4DA;
    font-weight:700;
    letter-spacing:.03em;
  }
  .score-box .n{
    font-size:20px;
    color:#fff;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .hint{
    font-size:13px;
    color:#9B9088;
  }
  button#newGame{
    font-family:inherit;
    border:none;
    background:#8F7A66;
    color:#fff;
    font-size:14px;
    font-weight:700;
    padding:9px 16px;
    border-radius:6px;
    cursor:pointer;
  }
  button#newGame:active{ transform:translateY(1px); }
  #board-wrap{
    position:relative;
    background:var(--board);
    border-radius:8px;
    padding:10px;
  }
  #board{
    position:relative;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(4,1fr);
    gap:10px;
    width:100%;
    aspect-ratio:1/1;
  }
  .bg-cell{
    background:rgba(238,228,218,0.35);
    border-radius:5px;
  }
  #tiles{
    position:absolute;
    inset:10px;
  }
  .tile{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:5px;
    font-weight:700;
    transition:top .12s ease, left .12s ease;
    animation:pop .14s ease;
  }
  @keyframes pop{
    0%{ transform:scale(0.5); }
    100%{ transform:scale(1); }
  }
  .panel{
    position:absolute;
    inset:10px;
    background:rgba(250,248,239,0.82);
    border-radius:8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:10;
  }
  .panel h2{
    margin:0 0 14px;
    font-size:28px;
    color:var(--text-dark);
  }
  .panel button{
    font-family:inherit;
    border:none;
    background:#8F7A66;
    color:#fff;
    font-size:14px;
    font-weight:700;
    padding:10px 20px;
    border-radius:6px;
    cursor:pointer;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>2048</h1>
      <div class="sub">타일을 합쳐서 2048을 만드세요</div>
    </div>
    <div class="scores">
      <div class="score-box">
        <div class="l">SCORE</div>
        <div class="n" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="l">BEST</div>
        <div class="n" id="best">0</div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="hint">방향키 또는 스와이프로 이동</div>
    <button id="newGame">새 게임</button>
  </div>

  <div id="board-wrap">
    <div id="board">
      <div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div>
      <div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div>
      <div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div>
      <div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div>
      <div id="tiles"></div>
      <div class="panel" id="overPanel" style="display:none;">
        <h2 id="overTitle">게임 오버</h2>
        <button id="retryBtn">다시 하기</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const SIZE = 4;
  const tilesEl = document.getElementById('tiles');
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overPanel = document.getElementById('overPanel');
  const overTitle = document.getElementById('overTitle');

  const COLORS = {
    2:['#EEE4DA','#776E65'], 4:['#EDE0C8','#776E65'],
    8:['#F2B179','#F9F6F2'], 16:['#F59563','#F9F6F2'],
    32:['#F67C5F','#F9F6F2'], 64:['#F65E3B','#F9F6F2'],
    128:['#EDCF72','#F9F6F2'], 256:['#EDCC61','#F9F6F2'],
    512:['#EDC850','#F9F6F2'], 1024:['#EDC53F','#F9F6F2'],
    2048:['#EDC22E','#F9F6F2']
  };

  let grid, score, best, won, over, idCounter;

  function loadBest(){
    try{ return parseInt(localStorage.getItem('g2048_best')||'0',10)||0; }catch(e){ return 0; }
  }
  function saveBest(v){
    try{ localStorage.setItem('g2048_best', String(v)); }catch(e){}
  }

  function newGame(){
    grid = Array.from({length:SIZE}, ()=>Array(SIZE).fill(null));
    score = 0;
    won = false;
    over = false;
    idCounter = 1;
    best = loadBest();
    overPanel.style.display = 'none';
    addRandomTile();
    addRandomTile();
    render();
  }

  function addRandomTile(){
    const empty = [];
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(!grid[r][c]) empty.push([r,c]);
    if(empty.length===0) return;
    const [r,c] = empty[Math.floor(Math.random()*empty.length)];
    grid[r][c] = { id:idCounter++, value: Math.random()<0.9?2:4, isNew:true };
  }

  function cellSize(){
    const rect = boardEl.getBoundingClientRect();
    const inner = rect.width - 20; // padding 10 each side
    const gap = 10;
    return (inner - gap*3) / 4;
  }

  function render(){
    const s = cellSize();
    tilesEl.innerHTML = '';
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const t = grid[r][c];
        if(!t) continue;
        const div = document.createElement('div');
        div.className = 'tile';
        const v = t.value;
        const [bg,fg] = COLORS[v] || ['#3C3A32','#F9F6F2'];
        div.style.background = bg;
        div.style.color = fg;
        div.style.width = s+'px';
        div.style.height = s+'px';
        div.style.left = (c*(s+10))+'px';
        div.style.top = (r*(s+10))+'px';
        div.style.fontSize = (v>512 ? s*0.32 : v>64 ? s*0.36 : s*0.42)+'px';
        div.textContent = v;
        tilesEl.appendChild(div);
      }
    }
    scoreEl.textContent = score;
    if(score > best){ best = score; saveBest(best); }
    bestEl.textContent = best;
  }

  function cloneGrid(g){
    return g.map(row=>row.map(cell=>cell?{...cell}:null));
  }
  function gridsEqual(a,b){
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
      const av = a[r][c]?a[r][c].value:0;
      const bv = b[r][c]?b[r][c].value:0;
      if(av!==bv) return false;
    }
    return true;
  }

  // slide+merge a single line (array of cells, left-to-right), returns {line, gained}
  function slideLine(line){
    const vals = line.filter(c=>c);
    const result = [];
    let gained = 0;
    for(let i=0;i<vals.length;i++){
      if(i<vals.length-1 && vals[i].value === vals[i+1].value){
        const merged = { id:idCounter++, value: vals[i].value*2, merged:true };
        result.push(merged);
        gained += merged.value;
        i++;
      } else {
        result.push(vals[i]);
      }
    }
    while(result.length < SIZE) result.push(null);
    return { line: result, gained };
  }

  function move(dir){
    if(over) return;
    const before = cloneGrid(grid);
    let totalGain = 0;

    if(dir==='left' || dir==='right'){
      for(let r=0;r<SIZE;r++){
        let row = grid[r].slice();
        if(dir==='right') row.reverse();
        const { line, gained } = slideLine(row);
        totalGain += gained;
        if(dir==='right') line.reverse();
        grid[r] = line;
      }
    } else {
      for(let c=0;c<SIZE;c++){
        let col = [grid[0][c],grid[1][c],grid[2][c],grid[3][c]];
        if(dir==='up') { /* top to bottom natural */ } else { col.reverse(); }
        const { line, gained } = slideLine(col);
        totalGain += gained;
        if(dir==='down') line.reverse();
        for(let r=0;r<SIZE;r++) grid[r][c] = line[r];
      }
    }

    if(!gridsEqual(before, grid)){
      score += totalGain;
      addRandomTile();
      render();
      checkGameState();
    }
  }

  function checkGameState(){
    // win check
    if(!won){
      for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
        if(grid[r][c] && grid[r][c].value===2048){
          won = true;
          overTitle.textContent = '2048 달성! 🎉';
          overPanel.style.display = 'flex';
          over = false; // allow continuing if they close... but keep simple: stop here
          return;
        }
      }
    }
    // full board?
    let full = true;
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(!grid[r][c]) full = false;
    if(!full) return;

    // any moves left?
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const v = grid[r][c].value;
        if(c<SIZE-1 && grid[r][c+1].value===v) return;
        if(r<SIZE-1 && grid[r+1][c].value===v) return;
      }
    }
    over = true;
    overTitle.textContent = '게임 오버';
    overPanel.style.display = 'flex';
  }

  // keyboard
  window.addEventListener('keydown', (e)=>{
    const map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' };
    if(map[e.key]){
      e.preventDefault();
      move(map[e.key]);
    }
  });

  // touch swipe
  let touchStartX=0, touchStartY=0;
  boardEl.addEventListener('touchstart', (e)=>{
    const t = e.changedTouches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
  }, {passive:true});
  boardEl.addEventListener('touchend', (e)=>{
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if(Math.max(Math.abs(dx),Math.abs(dy)) < 24) return;
    if(Math.abs(dx) > Math.abs(dy)){
      move(dx>0 ? 'right' : 'left');
    } else {
      move(dy>0 ? 'down' : 'up');
    }
  }, {passive:true});

  document.getElementById('newGame').addEventListener('click', newGame);
  document.getElementById('retryBtn').addEventListener('click', newGame);
  window.addEventListener('resize', render);

  newGame();
})();
</script>
</body>
</html>
